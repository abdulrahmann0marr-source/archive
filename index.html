<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرشيف عبدالرحمن</title>
<meta name="description" content="أرشيف شخصي للمقالات والتقارير والمراجعات">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #120F0C;
    --bg-raised: #19150F;
    --hairline: #2B241A;
    --ink: #EAE2D1;
    --ink-dim: #9C907A;
    --ink-faint: #675E4C;
    --brass: #C5943D;
    --brass-dim: #7A5F2C;
    --measure: 640px;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(197,148,61,0.06), transparent 60%);
    color: var(--ink);
    font-family: 'Noto Naskh Arabic', 'Amiri', serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  ::selection{ background: var(--brass); color: #120F0C; }

  a{ color: inherit; text-decoration: none; }

  .wrap{
    max-width: 780px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ===== Masthead ===== */
  header.masthead{
    padding: 72px 0 40px;
    text-align: center;
    border-bottom: 1px solid var(--hairline);
  }
  header.masthead .kicker{
    font-family: 'Noto Naskh Arabic', serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--brass);
    margin-bottom: 14px;
  }
  header.masthead h1{
    font-family: 'Aref Ruqaa', serif;
    font-weight: 700;
    font-size: clamp(40px, 7vw, 62px);
    margin: 0 0 12px;
    line-height: 1.15;
  }
  header.masthead p.tagline{
    color: var(--ink-dim);
    font-size: 16px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.9;
  }

  /* ===== Filter tabs ===== */
  nav.filters{
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 18px;
    flex-wrap: wrap;
    padding: 28px 0;
    font-size: 14px;
    color: var(--ink-faint);
  }
  nav.filters button{
    background:none;
    border:none;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink-dim);
    cursor:pointer;
    padding: 4px 2px;
    position: relative;
  }
  nav.filters button.active{ color: var(--brass); }
  nav.filters button.active::after{
    content:'';
    position:absolute;
    right:0; left:0; bottom:-3px;
    height:1px;
    background: var(--brass);
  }
  nav.filters .dot{ color: var(--ink-faint); font-size: 10px; }

  /* ===== Article list ===== */
  ul.entries{
    list-style:none;
    margin:0; padding: 8px 0 100px;
  }
  ul.entries li{
    border-bottom: 1px solid var(--hairline);
  }
  ul.entries li .row{
    display:flex;
    justify-content:space-between;
    align-items: baseline;
    gap: 20px;
    padding: 30px 4px;
  }
  ul.entries li a.entry-link{
    display:block;
    flex: 1;
    min-width: 0;
  }
  ul.entries li a.entry-link:hover .title,
  ul.entries li a.entry-link:focus-visible .title{
    color: var(--brass);
  }
  ul.entries li a.entry-link:hover .underline,
  ul.entries li a.entry-link:focus-visible .underline{
    transform: scaleX(1);
  }
  .eyebrow{
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--brass-dim);
    margin-bottom: 10px;
  }
  .title{
    font-family: 'Aref Ruqaa', serif;
    font-size: clamp(22px, 3.4vw, 30px);
    line-height: 1.5;
    margin: 0 0 8px;
    transition: color 0.25s ease;
    position: relative;
    display: inline;
  }
  .title-wrap{ position: relative; display: inline-block; }
  .underline{
    position:absolute;
    right:0; left:0; bottom: -2px;
    height: 1px;
    background: var(--brass);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.35s ease;
  }
  .subtitle{
    font-size: 14px;
    color: var(--ink-faint);
    margin: 0 0 6px;
  }
  .excerpt{
    font-size: 14px;
    color: var(--ink-dim);
    line-height: 1.8;
    max-width: var(--measure);
  }
  .meta-col{
    flex-shrink: 0;
    text-align: left;
    font-size: 12px;
    color: var(--ink-faint);
    white-space: nowrap;
    padding-top: 2px;
  }
  .badge-draft{
    display:inline-block;
    font-size: 11px;
    color: var(--ink-faint);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    padding: 2px 8px;
    margin-top: 8px;
  }
  li.draft .title{ color: var(--ink-faint); }
  li.draft a.entry-link{ cursor: default; }
  li.draft a.entry-link:hover .title{ color: var(--ink-faint); }

  /* ===== Footer ===== */
  footer{
    text-align:center;
    padding: 40px 0 60px;
    color: var(--ink-faint);
    font-size: 12px;
    letter-spacing: 0.04em;
  }

  /* ===== Reader view ===== */
  .reader{ display:none; }
  .reader.active{ display:block; }
  .list-view.hidden{ display:none; }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    color: var(--brass);
    font-size: 14px;
    margin: 40px 0 30px;
  }
  .back-link:hover{ opacity: 0.8; }

  article.piece header{
    padding-bottom: 28px;
    margin-bottom: 34px;
    border-bottom: 1px solid var(--hairline);
    text-align: right;
  }
  article.piece .eyebrow{ margin-bottom: 16px; }
  article.piece h2{
    font-family: 'Aref Ruqaa', serif;
    font-weight: 700;
    font-size: clamp(30px, 5vw, 44px);
    line-height: 1.4;
    margin: 0 0 10px;
  }
  article.piece .piece-subtitle{
    color: var(--ink-dim);
    font-size: 16px;
  }
  article.piece .body p{
    font-size: 19px;
    line-height: 2.15;
    color: var(--ink);
    margin: 0 0 26px;
    max-width: var(--measure);
    text-align: justify;
  }
  article.piece .body{
    padding-bottom: 100px;
  }

  @media (max-width: 560px){
    ul.entries li .row{ flex-direction: column; align-items: flex-start; }
    .meta-col{ text-align: right; }
    article.piece .body p{ font-size: 17px; line-height: 2; }
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- ===== LIST VIEW ===== -->
  <div id="listView" class="list-view">
    <header class="masthead">
      <div class="kicker">أرشيف شخصي</div>
      <h1>عبدالرحمن حسين</h1>
      <p class="tagline">مقالات وتقارير ومراجعات، محاولة لتوثيق ما يستحق التأمل قبل أن يبتلعه الزحام.</p>
    </header>

    <nav class="filters" id="filters"></nav>

    <ul class="entries" id="entries"></ul>
  </div>

  <!-- ===== READER VIEW ===== -->
  <div id="readerView" class="reader">
    <a href="#/" class="back-link">→ العودة إلى الأرشيف</a>
    <article class="piece" id="pieceContent"></article>
  </div>

  <footer>أُضيفت المقالات يدويًا، وتُحفَظ في هذا الملف وحده</footer>
</div>

<script>

   ========================================================================= */

  const ARTICLES = [
    {
      slug: "bikam-tabee-jabhatak",
      title: "بكم تبيع جبهتك؟",
      category: "مقالة",
      date: "",
      ready: true,
      content: [
"في رحلةِ تصفح مُعتادة، وبلا مبالاة لواقعٍ مُهدرٍ أو لطاقةٍ مسلوبة؛ اصطدمت بأحد الأخبار الغريبة في مَضمونها، فوجهتُ أناملي مُنساقًا -لا شعوريًا- للنقر على رابط العنوان؛ طلبًا لمزيدٍ من التفاصيل أو بحثًا عن مبررات لِمَنطقيةِ هذا الحدث، جاء عنوان الخبر كالتالي:",
"\"امرأة حامل تعرض بطنها للتأجير في مزاد علني على موقع \"أي بي (e-Bay) الإلكتروني\" وقد عللت ذلك بقولها: \"أنها بحاجة ماسة للمال لتحمل تكاليف الولادة، وإعالة طفلها فيما بعد\".",
"وقد تظن عزيزي القارئ أن الأمر هو مُجرد حالة اِستثنائية لشخص أصابه الجنون أو المس، وكثيرًا ما يُصاب الخلق بهذا إلى حَد ادّعاءِ النبوة مثلًا، إلّا أنّه وفي ذات الخبر، ذُكِرَ أن تلك المرأة استلهمت فكرتها العبقرية تلك من طالبٍ يُدعى \"أندور فيشر\" والذي قام بتأجير جبهته كلوحةٍ إعلانية لمدة شهر وحاز لقاء ذلك على (20) ألف جنيه استرليني!",
"وكان لأندرو السبق بهذه الفكرة الوليدة، فتبعتهُ فيها الكثير من الشركات والـ (start ups)؛ للترويج لمنتجاتها بصورة غير اِعتيادية، من بينهم شركة تويوتا الشهيرة.",
"لاقى الأمر استهجانًا في بادئ الأمر من الجماهير، إلا أنه وبمرور الوقت وبعاملِ التكرار، يتسرب إلى عقل الفتى ما يود تجاهله فقط؛ عندما يُرخي دفاعات عقله الذهنية فيجعل من نفسه فريسة سهلة لتلك الأفكار، ويصير واقعًا يسلم له حواسه؛ واقعًا بدأ تَقبّلَه كأمر اِعتيادي أو كفكرةٍ عبقرية للدعايا والإعلان، وأصبحت الشركات تتهافت على \"أندرو\" وأمثال \"الأندرو\" من الشباب بعروض أكثر سخاءً لتُؤجر جباههم! بل ومنهم من تفنن ليعرض الإعلانات على مناطق مختلفة من جسده، كاِمرأة قامت بحلق شعرها فقط لعمل وشم (tattoo) دعائي على رأسها!",
"واليوم يعرض مطعم (subway) الشهير \"الوشم\" في مقابل وجبات مجانية مدى الحياة.",
"وقبل أن تتهكم في السخرية، قبل أن تضحك بصوت عالٍ أو بنبرةٍ يُخالطها اشمئزازٌ غير مُعلن، تأمل عالمك، ثيابك، قصة شعرك.. إلخ. ثم أجب عن سؤالٍ واحد: هل يَلزم بالضرورة أن نُوشِم أجسادنا لنستحيل للوحاتٍ إعلانية مُتنقلة؟",
"لا شك بأن مثال الوشم الدعائي هو المثال الأكثر فظاظة؛ ولكن دعنا نُعِد النظر في المدخلات من حولنا، أليست كرة القدم تُعد مِثالًا صارخًا على التسليع أيضًا؟ ابتداءً بالتيشيرت الذي يلبسه اللاعب، شريط الإعلانات المُنبثِق من حواف الملعب، وصولًا إلى عُلبة المشروبات الغازية الماثلة أمام لاعبنا خلال المؤتمر الصحفي للمباراة، هنا تسأل: هل انقلب سحر المستديرة إلى سحر الدعايا والإعلان؟",
"ثم دعني أطرح أشكالًا أخرى؛ ما دَخْل النساء شبه العاريات، بمنتجٍ كرقائق البطاطا المقلية أو بإعلان لإحدى السيارات الفارهة؟ لماذا لا نشتري السيارة لكونها \"هي\" كمنتج ذو منفعة عامة وعلى هذا الأساس يُصَمَّم الإعلان؟",
"أليس هذا هو عين التسليع؟ أعني تسليع الجسد \"الحر\" في زمن الحرية المطلقة! وبين هذا وذاك حدث تغيّر جذري في النظرة المجتمعية تجاه المرأة من النظرة الصحية السليمة، إلى جسدٍ مُجردٍ من القدرات العقلية يوضع كملصق إعلاني إلى جانب مُلصق الضريبة على كافة المنتجات.",

      ]
    },
    { slug:"rashfat-alwadaa", title:"رشفة الوداع، من شاي النعيم", subtitle:"عن مصطفى مشرفة", category:"مقالة", date:"", ready:true, content:[content: [
"هُناك وفي إحدىٰ حجرات ذلك البيت الفسيح، اِعتاد الدكتور مشرفة الولوج إلىٰ موضعه وحَقل تجاربه، كما اعتاد أيضًا أن يرتشف مِن ذلك الكوب رشفاتٍ خِفافٍ، يستزيد بها علىٰ المُطالعة والبحث في جنبات ذلك العالم الرَحب، فهو وبِسَجيَّته لم يعرف طعم اللذة يومًا في لَعِبٍ كبقية الفتيان في مثل عمره؛ وانطوت لذته في تصفح صفحات الكُتب يُجاورها ذلك الكوب مِن \"الشاي\".. أفيون عقله الوحيد، ومدخله إلىٰ عالم العلم المُتخيل، بعيدًا عن عالمِ المعرفة المَحسوس؛ فمِن وحي الخيال يَفترض أفكاره وأبحاثه!",
"مشرفة والعِلم",
"مِن مواليد \"دمياط\" (11) يوليو (1898)، هو الدكتور \"علي مُصطفىٰ مشرفة\" أو \"أينشتاين العرب\" كما يُلقبه البعض، ولِمَّ لا؟ وقد أشادَ \"أينشتاين\" نفسه بِأبحاثه، وحَدث أن نعاه عند موته؛ ذلك لأن معظم أبحاثه كانت تدور حول: (النسبية - الذرة - ميكانيكا الكم) وقد كان مُولعًا بِطبيعة العلاقة بين الإشعاع والمادة. نشر ما يقرب من (25) بحثًا ودراسة أصيلة نُشرت جميعها في الدوريات العالمية، وألَّف ما يقرب مِن (12) كتبًا في العلوم والرياضيات، تُرجمت إلىٰ لُغاتٍ عِدة. كما اهتم أيضًا بِترجمة العديد من الكُتب الأجنبية إلىٰ العربية، في مختلف المجالات مثل: (الفلك - والرياضيات). وكان من أهم إنجازاته في الترجمة تَحقِيقهُ وتعليقه علىٰ كِتاب \"الجبر والمقابلة\" للخوارزمي.",
"وليس هذا ما جعل منه أينشتاين العرب فحسب؛ بل أن تُحاكَ كُلُ تلك المُنجزات في فترةٍ وجيزة جَعلت مِنه نموذجًا عسير التكرار؛ فقد حاز درجة \"الأستاذية\" وهو في السابعة والعشرين مِن عمره، وكانت لا تُمنح -في ذلك الوقت- لِمَن هو دون الثلاثين؛ إلا أن شهادةَ العالِم \"بور\" أهلته لنيل هذهِ الدرجة.",
"وما يؤهل مشرفة لكل ذلك هو -بدايةً- تَحصله المركز الثاني علىٰ القطر -الجمهورية حاليًا- في الثانوية، ثم الالتحاق بِمدرسة المُعلمين العليا وتخرج فيها سنة (1917)، وسافر في بعثة تنقل خلالها بين مناراتِ إنجلترا، وهناك تحصل علىٰ البكالوريوس في \"الرياضيات\"، ثم علىٰ الدكتوراه في \"علوم الفلسفة\"، ومنها إلىٰ درجة الدكتوراه في العلوم \"DSC\" سنة (1923) والتي تُعد أعلىٰ درجة في مجال العلوم، وكان أول مصري يحصل علىٰ تلك الدرجة العلمية الرفيعة.",
"مشرفة والعالم",
"تَحمل المسؤولية كونه أكبر أفراد العائلة بعد وفاة والده، وهو لا يزال يافعًا ذو عشرة أعوام، فانعكس ذلك علىٰ شخصه، وجعل منه إنسانًا يعمل لغيره، ويُضحي لأجل رفعة من يُحب، فلم يَنعزل ويُكرس حياته لنفسه والعِلمَ فقط، بل خَرج للعالم والعامة، فقام بتأليف العديد من الكتب وُجِهت إلىٰ عامة الناس، تَتَضمن موضوعاتٍ علمية مُبَسَطَة المصطلحات والمفاهيم؛ بحيث يجعلُها لُغةَ حوار لعامة الشعب؛ فكان يأمل في يومٍ ما أن يُشهدَ قومٌ علىٰ إحدىٰ المقاهي الشعبية يتباحثون في شأنٍ يخص العِلم، هكذا كان يُفكر وهكذا كان يُحب أن يرىٰ الأجيال القادمة، ولعل بِذرته لم تمت، فلقد بدا أثرهُ واضحًا علىٰ مَن لحقه مِنَ الأجيال، من بينهم سميرة موسى التي رفضت المكوث في بلاد الغرب، وقررت العودة لِرفعةِ أمتها، وهي التي لاقت ما لاقت في سبيل ذلك!",
"مشرفة واللغة العربية",
"آمن مشرفة بِضرورة الإعتزاز باللغة، وجَعَلَ منها الوسيلةَ التي تدفع لنهضة الأمم، لِما لها من قدرة علىٰ اتصال تلك الأمة بماضيها، والعزة بحاضرها، والولوج إلىٰ المستقبل دونَ خوفٍ يعتريها، ودلَّ على ذلك ترجماته العديدة التي قام بها، غير أنه لم يكتفي بذلك فحسب بل قام بإنشاء قسم خاص بِالترجمة في الكليّة، كما أنشأ الجمعية المصرية لعلوم الرياضيات و العلوم الطبيعية.",

  const CATEGORIES = ["الكل", "مقالة", "تقرير", "مراجعة", "مقابلة"];
  let activeCategory = "الكل";

  const filtersEl = document.getElementById('filters');
  const entriesEl = document.getElementById('entries');
  const listView = document.getElementById('listView');
  const readerView = document.getElementById('readerView');
  const pieceContent = document.getElementById('pieceContent');

  function renderFilters(){
    filtersEl.innerHTML = CATEGORIES.map((cat, i) => {
      const btn = `<button data-cat="${cat}" class="${cat===activeCategory ? 'active':''}">${cat}</button>`;
      return i < CATEGORIES.length - 1 ? btn + `<span class="dot">•</span>` : btn;
    }).join('');
    filtersEl.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        activeCategory = b.dataset.cat;
        renderFilters();
        renderList();
      });
    });
  }

  function renderList(){
    const items = ARTICLES.filter(a => activeCategory === "الكل" || a.category === activeCategory);
    entriesEl.innerHTML = items.map(a => `
      <li class="${a.ready ? '' : 'draft'}">
        <a class="entry-link" href="${a.ready ? '#/'+a.slug : '#'}">
          <div class="row">
            <div style="min-width:0;">
              <div class="eyebrow">${a.category}${a.date ? ' · ' + a.date : ''}</div>
              <div class="title-wrap">
                <span class="title">${a.title}</span>
                <span class="underline"></span>
              </div>
              ${a.subtitle ? `<div class="subtitle">${a.subtitle}</div>` : ''}
              ${!a.ready ? `<div class="badge-draft">النص الكامل لسه هيتضاف</div>` : ''}
            </div>
          </div>
        </a>
      </li>
    `).join('');
  }

  function renderPiece(slug){
    const a = ARTICLES.find(x => x.slug === slug && x.ready);
    if(!a){ window.location.hash = '#/'; return; }
    document.title = a.title + ' — أرشيف عبدالرحمن';
    pieceContent.innerHTML = `
      <header>
        <div class="eyebrow">${a.category}${a.date ? ' · ' + a.date : ''}</div>
        <h2>${a.title}</h2>
        ${a.subtitle ? `<div class="piece-subtitle">${a.subtitle}</div>` : ''}
      </header>
      <div class="body">
        ${a.content.map(p => `<p>${p}</p>`).join('')}
      </div>
    `;
  }

  function route(){
    const hash = window.location.hash;
    if(hash.startsWith('#/') && hash.length > 2){
      const slug = hash.slice(2);
      renderPiece(slug);
      listView.classList.add('hidden');
      readerView.classList.add('active');
      window.scrollTo(0,0);
    } else {
      listView.classList.remove('hidden');
      readerView.classList.remove('active');
      document.title = 'أرشيف عبدالرحمن';
    }
  }

  renderFilters();
  renderList();
  window.addEventListener('hashchange', route);
  route();
</script>
