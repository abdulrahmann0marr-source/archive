<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرشيف عبدالرحمن حسين</title>
<meta name="description" content="أرشيف شخصي للمقالات والتقارير والمراجعات">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #120F0C;
    --bg-raised: #19150F;
    --hairline: #2B241A;
    --ink: #EAE2D1;
    --ink-dim: #9C907A;
    --ink-faint: #675E4C;
    --brass: #C5943D;
    --brass-dim: #7A5F2C;
    --measure: 640px;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    background-image: radial-gradient(ellipse 900px 500px at 15% -10%, rgba(197,148,61,0.06), transparent 60%);
    color: var(--ink);
    font-family: 'Noto Naskh Arabic', 'Amiri', serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  ::selection{ background: var(--brass); color: #120F0C; }
  a{ color: inherit; text-decoration: none; }
  .wrap{ max-width: 780px; margin: 0 auto; padding: 0 24px; }

  header.masthead{ padding: 72px 0 40px; text-align: center; border-bottom: 1px solid var(--hairline); }
  header.masthead .kicker{ font-size: 13px; letter-spacing: 0.08em; color: var(--brass); margin-bottom: 14px; }
  header.masthead h1{ font-family: 'Aref Ruqaa', serif; font-weight: 700; font-size: clamp(40px, 7vw, 62px); margin: 0 0 12px; line-height: 1.15; }
  header.masthead p.tagline{ color: var(--ink-dim); font-size: 16px; max-width: 480px; margin: 0 auto; line-height: 1.9; }

  nav.filters{ display:flex; justify-content:center; align-items:center; gap: 18px; flex-wrap: wrap; padding: 28px 0; font-size: 14px; color: var(--ink-faint); }
  nav.filters button{ background:none; border:none; font-family: inherit; font-size: 14px; color: var(--ink-dim); cursor:pointer; padding: 4px 2px; position: relative; }
  nav.filters button.active{ color: var(--brass); }
  nav.filters button.active::after{ content:''; position:absolute; right:0; left:0; bottom:-3px; height:1px; background: var(--brass); }
  nav.filters .dot{ color: var(--ink-faint); font-size: 10px; }

  ul.entries{ list-style:none; margin:0; padding: 8px 0 100px; }
  ul.entries li{ border-bottom: 1px solid var(--hairline); }
  ul.entries li .row{ display:flex; justify-content:space-between; align-items: baseline; gap: 20px; padding: 30px 4px; }
  ul.entries li a.entry-link{ display:block; flex: 1; min-width: 0; }
  ul.entries li a.entry-link:hover .title, ul.entries li a.entry-link:focus-visible .title{ color: var(--brass); }
  ul.entries li a.entry-link:hover .underline, ul.entries li a.entry-link:focus-visible .underline{ transform: scaleX(1); }
  .eyebrow{ font-size: 12px; letter-spacing: 0.06em; color: var(--brass-dim); margin-bottom: 10px; }
  .title{ font-family: 'Aref Ruqaa', serif; font-size: clamp(22px, 3.4vw, 30px); line-height: 1.5; margin: 0 0 8px; transition: color 0.25s ease; position: relative; display: inline; }
  .title-wrap{ position: relative; display: inline-block; }
  .underline{ position:absolute; right:0; left:0; bottom: -2px; height: 1px; background: var(--brass); transform: scaleX(0); transform-origin: right; transition: transform 0.35s ease; }
  .subtitle{ font-size: 14px; color: var(--ink-faint); margin: 0 0 6px; }
  .badge-draft{ display:inline-block; font-size: 11px; color: var(--ink-faint); border: 1px solid var(--hairline); border-radius: 3px; padding: 2px 8px; margin-top: 8px; }
  li.draft .title{ color: var(--ink-faint); }
  li.draft a.entry-link{ cursor: default; }
  li.draft a.entry-link:hover .title{ color: var(--ink-faint); }

  footer{ text-align:center; padding: 40px 0 60px; color: var(--ink-faint); font-size: 12px; letter-spacing: 0.04em; }
  footer a{ color: var(--brass-dim); }

  .reader{ display:none; }
  .reader.active{ display:block; }
  .list-view.hidden{ display:none; }
  .reader-nav{ display:flex; justify-content:flex-start; align-items:center; gap: 12px; margin: 40px 0 30px; }
  .back-link, .share-btn{
    display:inline-flex; align-items:center; gap: 7px;
    background: none; border: 1px solid var(--hairline); color: var(--ink-dim);
    font-family: inherit; font-size: 13px; padding: 8px 16px; border-radius: 6px;
    cursor: pointer; transition: border-color 0.2s ease, color 0.2s ease;
  }
  .back-link:hover, .share-btn:hover{ border-color: var(--brass); color: var(--brass); }
  .share-btn.copied{ border-color: #7DA870; color: #7DA870; }
  .share-btn svg{ width: 14px; height: 14px; flex-shrink: 0; }
  article.piece header{ padding-bottom: 28px; margin-bottom: 34px; border-bottom: 1px solid var(--hairline); text-align: right; }
  article.piece .eyebrow{ margin-bottom: 16px; }
  article.piece h2{ font-family: 'Aref Ruqaa', serif; font-weight: 700; font-size: clamp(30px, 5vw, 44px); line-height: 1.4; margin: 0 0 10px; }
  article.piece .piece-subtitle{ color: var(--ink-dim); font-size: 16px; }
  article.piece .body p{ font-size: 19px; line-height: 2.15; color: var(--ink); margin: 0 0 26px; max-width: var(--measure); text-align: justify; }
  article.piece .body{ padding-bottom: 100px; }
  article.piece .cover{ width: 100%; max-width: var(--measure); border: 1px solid var(--hairline); border-radius: 6px; margin: 0 0 34px; display:block; }
  article.piece .body img{ width: 100%; max-width: var(--measure); border: 1px solid var(--hairline); border-radius: 6px; margin: 0 0 26px; display:block; }

  .state-msg{ text-align:center; color: var(--ink-faint); padding: 60px 0; font-size: 14px; }

  /* Share modal */
  .share-overlay{
    display:none; position: fixed; inset: 0; background: rgba(8,6,4,0.72);
    z-index: 100; align-items: center; justify-content: center; padding: 24px;
  }
  .share-overlay.active{ display:flex; }
  .share-card{
    background: var(--bg-raised); border: 1px solid var(--hairline); border-radius: 10px;
    max-width: 380px; width: 100%; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .share-card .preview-img{ width: 100%; aspect-ratio: 1.9 / 1; object-fit: cover; display:block; background: var(--bg); border-bottom: 1px solid var(--hairline); }
  .share-card .preview-body{ padding: 20px 22px 6px; text-align: right; }
  .share-card .preview-eyebrow{ font-size: 11px; letter-spacing: 0.06em; color: var(--brass-dim); margin-bottom: 8px; }
  .share-card .preview-title{ font-family: 'Aref Ruqaa', serif; font-size: 22px; line-height: 1.5; margin: 0 0 6px; }
  .share-card .preview-subtitle{ font-size: 13px; color: var(--ink-faint); margin: 0 0 4px; }
  .share-actions{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 18px 20px; }
  .share-actions a, .share-actions button{
    display:flex; flex-direction:column; align-items:center; gap: 7px;
    background:none; border:none; color: var(--ink-dim); font-family: inherit; font-size: 11px;
    cursor:pointer; padding: 4px 0;
  }
  .share-actions .icon-circle{
    width: 42px; height: 42px; border-radius: 50%; display:flex; align-items:center; justify-content:center;
    background: var(--bg); border: 1px solid var(--hairline); color: var(--ink-dim);
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .share-actions a:hover .icon-circle, .share-actions button:hover .icon-circle{ border-color: var(--brass); color: var(--brass); }
  .share-actions .icon-circle svg{ width: 18px; height: 18px; }
  .share-actions .copy-btn.copied .icon-circle{ border-color: #7DA870; color: #7DA870; }
  .share-close{
    display:block; width: 100%; background: none; border: none; border-top: 1px solid var(--hairline);
    color: var(--ink-faint); font-family: inherit; font-size: 13px; padding: 14px; cursor: pointer;
  }
  .share-close:hover{ color: var(--ink-dim); }

  @media (max-width: 560px){
    ul.entries li .row{ flex-direction: column; align-items: flex-start; }
    article.piece .body p{ font-size: 17px; line-height: 2; }
  }
</style>
</head>
<body>

<div id="shareOverlay" class="share-overlay">
  <div class="share-card">
    <img id="sharePreviewImg" class="preview-img" alt="" style="display:none;">
    <div class="preview-body">
      <div class="preview-eyebrow" id="sharePreviewEyebrow"></div>
      <div class="preview-title" id="sharePreviewTitle"></div>
      <div class="preview-subtitle" id="sharePreviewSubtitle"></div>
    </div>
    <div class="share-actions">
      <a id="shareWhatsapp" href="#" target="_blank" rel="noopener">
        <span class="icon-circle"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.6.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5C10 9 9.5 7.8 9.3 7.3c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1.1 2.7c.1.2 1.9 2.9 4.6 4 .6.3 1.1.4 1.5.6.6.2 1.2.2 1.6.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2 0-.1-.2-.2-.5-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.4c1.4.8 3.1 1.2 4.8 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.3c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.3.9.9-3.2-.2-.3C4 14.9 3.6 13.5 3.6 12c0-4.6 3.8-8.4 8.4-8.4s8.4 3.8 8.4 8.4-3.8 8.3-8.4 8.3z"/></svg></span>
        واتساب
      </a>
      <a id="shareTwitter" href="#" target="_blank" rel="noopener">
        <span class="icon-circle"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.4 8.4L23 22h-6.9l-5.4-6.9L4.5 22H1.4l7.9-9L1 2h7.1l4.9 6.3L18.9 2zm-1.2 18h1.9L7.4 4h-2l12.3 16z"/></svg></span>
        إكس
      </a>
      <a id="shareTelegram" href="#" target="_blank" rel="noopener">
        <span class="icon-circle"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 2 2.5 10.3c-1.3.6-1.3 1.4-.2 1.7l5 1.6 1.9 6c.2.6.5.8 1 .8.4 0 .6-.2.9-.5l2.2-2.2 4.6 3.5c.9.5 1.5.2 1.7-.8L23.9 3.2c.3-1.3-.5-1.9-1.9-1.2z"/></svg></span>
        تيليجرام
      </a>
      <button id="shareCopy" class="copy-btn" type="button">
        <span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></span>
        <span id="shareCopyLabel">نسخ الرابط</span>
      </button>
    </div>
    <button id="shareModalClose" class="share-close" type="button">إغلاق</button>
  </div>
</div>

<div class="wrap">
  <div id="listView" class="list-view">
    <header class="masthead">
      <div class="kicker">أرشيف شخصي</div>
      <h1>عبدالرحمن حسين</h1>
      <p class="tagline">مقالات وتقارير ومراجعات، محاولة لتوثيق ما يستحق التأمل قبل أن يبتلعه الزحام.</p>
    </header>
    <nav class="filters" id="filters"></nav>
    <ul class="entries" id="entries"></ul>
  </div>

  <div id="readerView" class="reader">
    <div class="reader-nav">
      <a href="#/" class="back-link">→ العودة إلى الأرشيف</a>
      <button id="shareBtn" class="share-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"></line><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"></line></svg>
        <span id="shareBtnText">مشاركة</span>
      </button>
    </div>
    <article class="piece" id="pieceContent"></article>
  </div>

  <footer>أرشيف شخصي — عبدالرحمن حسين</footer>
</div>

<script>
  const CATEGORIES = ["الكل", "مقالة", "تقرير", "مراجعة", "مقابلة", "خواطر"];
  const SITE_URL = "https://abdulrahmann0marr-source.github.io/archive/";
  let activeCategory = "الكل";
  let ARTICLES = [];
  let currentArticle = null;

  const filtersEl = document.getElementById('filters');
  const entriesEl = document.getElementById('entries');
  const listView = document.getElementById('listView');
  const readerView = document.getElementById('readerView');
  const pieceContent = document.getElementById('pieceContent');
  const shareBtn = document.getElementById('shareBtn');
  const shareBtnText = document.getElementById('shareBtnText');

  function renderFilters(){
    filtersEl.innerHTML = CATEGORIES.map((cat, i) => {
      const btn = `<button data-cat="${cat}" class="${cat===activeCategory ? 'active':''}">${cat}</button>`;
      return i < CATEGORIES.length - 1 ? btn + `<span class="dot">•</span>` : btn;
    }).join('');
    filtersEl.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        activeCategory = b.dataset.cat;
        renderFilters();
        renderList();
      });
    });
  }

  function renderList(){
    const items = ARTICLES.filter(a => activeCategory === "الكل" || a.category === activeCategory);
    entriesEl.innerHTML = items.map(a => `
      <li class="${a.ready ? '' : 'draft'}">
        <a class="entry-link" href="${a.ready ? '#/'+a.slug : '#'}">
          <div class="row">
            <div style="min-width:0;">
              <div class="eyebrow">${a.category}${a.date ? ' · ' + a.date : ''}</div>
              <div class="title-wrap">
                <span class="title">${a.title}</span>
                <span class="underline"></span>
              </div>
              ${a.subtitle ? `<div class="subtitle">${a.subtitle}</div>` : ''}
              ${!a.ready ? `<div class="badge-draft">النص الكامل لسه هيتضاف</div>` : ''}
            </div>
          </div>
        </a>
      </li>
    `).join('');
  }

  function renderPiece(slug){
    const a = ARTICLES.find(x => x.slug === slug && x.ready);
    if(!a){ window.location.hash = '#/'; return; }
    currentArticle = a;
    document.title = a.title + ' — أرشيف عبدالرحمن حسين';
    const bodyHtml = a.content.map(p => {
      if(p.startsWith('IMG:')) return `<img src="${p.slice(4).trim()}" alt="">`;
      return `<p>${p}</p>`;
    }).join('');
    pieceContent.innerHTML = `
      <header>
        <div class="eyebrow">${a.category}${a.date ? ' · ' + a.date : ''}</div>
        <h2>${a.title}</h2>
        ${a.subtitle ? `<div class="piece-subtitle">${a.subtitle}</div>` : ''}
      </header>
      ${a.image ? `<img class="cover" src="${a.image}" alt="">` : ''}
      <div class="body">${bodyHtml}</div>
    `;
  }

  const shareOverlay = document.getElementById('shareOverlay');
  const sharePreviewImg = document.getElementById('sharePreviewImg');
  const sharePreviewEyebrow = document.getElementById('sharePreviewEyebrow');
  const sharePreviewTitle = document.getElementById('sharePreviewTitle');
  const sharePreviewSubtitle = document.getElementById('sharePreviewSubtitle');
  const shareWhatsapp = document.getElementById('shareWhatsapp');
  const shareTwitter = document.getElementById('shareTwitter');
  const shareTelegram = document.getElementById('shareTelegram');
  const shareCopy = document.getElementById('shareCopy');
  const shareCopyLabel = document.getElementById('shareCopyLabel');
  const shareModalClose = document.getElementById('shareModalClose');

  function resolveImageUrl(img){
    if(!img) return '';
    return /^https?:\/\//.test(img) ? img : SITE_URL + img;
  }

  function openShareModal(){
    if(!currentArticle) return;
    const shareUrl = SITE_URL + 'a/' + currentArticle.slug + '.html';
    const imgUrl = resolveImageUrl(currentArticle.image);

    if(imgUrl){
      sharePreviewImg.src = imgUrl;
      sharePreviewImg.style.display = 'block';
    } else {
      sharePreviewImg.style.display = 'none';
    }
    sharePreviewEyebrow.textContent = currentArticle.category + (currentArticle.date ? ' · ' + currentArticle.date : '');
    sharePreviewTitle.textContent = currentArticle.title;
    sharePreviewSubtitle.textContent = currentArticle.subtitle || '';
    sharePreviewSubtitle.style.display = currentArticle.subtitle ? 'block' : 'none';

    const shareText = encodeURIComponent(currentArticle.title);
    const encodedUrl = encodeURIComponent(shareUrl);
    shareWhatsapp.href = `https://wa.me/?text=${shareText}%20${encodedUrl}`;
    shareTwitter.href = `https://twitter.com/intent/tweet?text=${shareText}&url=${encodedUrl}`;
    shareTelegram.href = `https://t.me/share/url?url=${encodedUrl}&text=${shareText}`;

    shareCopyLabel.textContent = 'نسخ الرابط';
    shareCopy.classList.remove('copied');
    shareCopy.dataset.url = shareUrl;

    shareOverlay.classList.add('active');
  }

  function closeShareModal(){
    shareOverlay.classList.remove('active');
  }

  shareBtn.addEventListener('click', openShareModal);
  shareModalClose.addEventListener('click', closeShareModal);
  shareOverlay.addEventListener('click', (e) => { if(e.target === shareOverlay) closeShareModal(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeShareModal(); });

  shareCopy.addEventListener('click', async () => {
    const url = shareCopy.dataset.url;
    try{
      await navigator.clipboard.writeText(url);
    }catch(e){
      window.prompt('انسخ الرابط:', url);
    }
    shareCopyLabel.textContent = 'تم النسخ';
    shareCopy.classList.add('copied');
    setTimeout(() => {
      shareCopyLabel.textContent = 'نسخ الرابط';
      shareCopy.classList.remove('copied');
    }, 1800);
  });

  function route(){
    const hash = window.location.hash;
    if(hash.startsWith('#/') && hash.length > 2){
      renderPiece(hash.slice(2));
      listView.classList.add('hidden');
      readerView.classList.add('active');
      window.scrollTo(0,0);
    } else {
      listView.classList.remove('hidden');
      readerView.classList.remove('active');
      document.title = 'أرشيف عبدالرحمن حسين';
    }
  }

  async function init(){
    entriesEl.innerHTML = `<div class="state-msg">جاري التحميل...</div>`;
    try{
      const res = await fetch('articles.json', { cache: 'no-store' });
      if(!res.ok) throw new Error('fetch failed');
      ARTICLES = await res.json();
      renderFilters();
      renderList();
      window.addEventListener('hashchange', route);
      route();
    }catch(e){
      entriesEl.innerHTML = `<div class="state-msg">تعذّر تحميل المقالات. تأكد إن ملف articles.json موجود بجوار index.html.</div>`;
    }
  }

  init();
</script>

</body>
</html>
